<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <style>
      .palette-panel {
        max-height: calc(100vh - 3rem);
        overflow-y: auto;
      }

      .preview-image {
        max-height: calc(100vh - 3rem);
        width: 100%;
        object-fit: contain;
      }
    </style>
</head>
<body class="bg-light">
  <div class="container-fluid py-4 px-4">
  <div class="row g-4 align-items-start">

       <div class="col-8">
           <form method="POST" enctype="multipart/form-data">
                <input type="file" name="image" class="form-control mb-3">
                <button class="btn btn-primary">Upload</button>
           </form>

           {% if image_filename %}
              <img
                src="{{ url_for('static', filename='uploads/' + image_filename) }}"
                class="preview-image rounded shadow-sm bg-white"
              >
           {% endif %}
      </div>

      <div class="col-4">
          <div class="palette-panel p-3 bg-white rounded shadow-sm">
              <div class="row row-cols-2 row-cols-xl-3 g-2">
                {% for color in colors %}
                  <div class="col">
                    <div class="card h-100">
                          <div class="card-img-top;" style="height: 80px; background-color:rgb{{ color }};"></div>
                          <div class="card-body p-2">
                             <p class="card-text med mb-0">{{ color }}</p>
                              <button
                                  type="button"
                                  class="btn btn-primary btn-sm copy-btn"
                                  data-rgb="{{ color }}"
                                >
                                  Copy
                              </button>
                          </div>
                      </div>
                  </div>
                {% endfor %}
              </div>
          </div>
      </div>
  </div>
  </div>
<script>
  const copyButtons = document.querySelectorAll(".copy-btn");

  copyButtons.forEach(function(button) {
    button.addEventListener("click", function() {
      const rgbValue = button.dataset.rgb;

      navigator.clipboard.writeText(rgbValue);

      button.textContent = "Copied!";

      setTimeout(function() {
        button.textContent = "Copy";
      }, 1000);
    });
  });
</script>
</body>
</html>
