<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body class="bg-black">
      <div class="background">
        <div class="box text-white">
          <div class="title fw-normal fs-2">/To-Do List/</div>
          <div class="task-header fw-light">
            <span>Task Name</span>
            <span>Status</span>
            <span>Progress</span>
            <span>Due date</span>
            <span>Notes</span>
            <span></span>
          </div>
          <div class="items">
            {% if tasks %}
              {% for task in tasks %}
                <form class="task-row" action="{{ url_for('update_task', task_id=task.id) }}" method="post">
                  <input class="form-control" type="text" name="task" value="{{ task.name }}" aria-label="Task name">
                  <select class="form-select" name="status" aria-label="Status">
                    {% for status in ["Not started", "In progress", "Blocked", "Done"] %}
                      <option value="{{ status }}" {% if task.status == status %}selected{% endif %}>{{ status }}</option>
                    {% endfor %}
                  </select>
                  <div class="progress-cell">
                    <input class="form-control" type="number" name="progress" min="0" max="100" value="{{ task.progress_percent }}" aria-label="Progress percent">
                    <div class="progress" role="progressbar" aria-label="Progress" aria-valuenow="{{ task.progress_percent }}" aria-valuemin="0" aria-valuemax="100">
                      <div class="progress-bar" style="width: {{ task.progress_percent }}%; background-color: {{ task.progress_color }};">
                        {{ task.progress_percent }}%
                      </div>
                    </div>
                  </div>
                  <input class="form-control" type="date" name="due_date" value="{{ task.due_date }}" aria-label="Due date">
                  <input class="form-control" type="text" name="notes" value="{{ task.notes }}" aria-label="Notes">
                  <div class="task-actions">
                    <button class="btn btn-light btn-sm" type="submit">Save</button>
                    <button class="btn btn-outline-light btn-sm" type="submit" form="delete-task-{{ task.id }}">Delete</button>
                  </div>
                </form>
                <form id="delete-task-{{ task.id }}" action="{{ url_for('delete_task', task_id=task.id) }}" method="post"></form>
              {% endfor %}
            {% else %}
              <div class="empty-state">No tasks yet.</div>
            {% endif %}
          </div>
          <form class="todo-form" action="/add" method="post">
            <input class="form-control" type="text" name="task" placeholder="Task name" required>
            <select class="form-select" name="status">
              <option selected>Not started</option>
              <option>In progress</option>
              <option>Blocked</option>
              <option>Done</option>
            </select>
            <input class="form-control" type="number" name="progress" min="0" max="100" placeholder="Progress">
            <input class="form-control" type="date" name="due_date">
            <input class="form-control" type="text" name="notes" placeholder="Notes">
            <button class="btn btn-light" type="submit">Add</button>
          </form>
        </div>
      </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
